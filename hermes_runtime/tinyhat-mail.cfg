// Tinyhat managed mail profile. The first line is reserved by AutoConfig.
// Thunderbird's documented enterprise AutoConfig and public MailServices API.
// Only our launcher supplies this path; ordinary Thunderbird profiles are untouched.
var tinyhatSettingsPath = getenv("TINYHAT_MAIL_SETTINGS_FILE");
if (tinyhatSettingsPath) {
  var { MailServices } = ChromeUtils.importESModule("resource:///modules/MailServices.sys.mjs");
  var file = Cc["@mozilla.org/file/local;1"].createInstance(Ci.nsIFile);
  file.initWithPath(tinyhatSettingsPath);
  var stream = Cc["@mozilla.org/network/file-input-stream;1"].createInstance(Ci.nsIFileInputStream);
  stream.init(file, 0x01, 0, 0);
  var converter = Cc["@mozilla.org/intl/converter-input-stream;1"].createInstance(Ci.nsIConverterInputStream);
  converter.init(stream, "UTF-8", 0, 0);
  var data = "", chunk = {};
  try {
    while (converter.readString(4096, chunk)) data += chunk.value;
  } finally {
    converter.close();
  }
  var mail = JSON.parse(data);
  var accounts = [];
  try { accounts = getPref("mail.accountmanager.accounts").split(",").filter(Boolean); } catch (_) {}
  if (!accounts.includes("account1")) accounts.unshift("account1");
  pref("mail.accountmanager.accounts", accounts.join(","));
  pref("mail.accountmanager.defaultaccount", "account1");
  pref("mail.account.account1.identities", "id1");
  pref("mail.account.account1.server", "server1");
  pref("mail.server.server1.type", "imap");
  pref("mail.server.server1.hostname", mail.host);
  pref("mail.server.server1.port", 993);
  pref("mail.server.server1.socketType", 3);
  pref("mail.server.server1.authMethod", 3);
  pref("mail.server.server1.userName", mail.username);
  pref("mail.server.server1.name", mail.address);
  pref("mail.server.server1.login_at_startup", true);
  pref("mail.server.server1.check_new_mail", true);
  pref("mail.server.server1.check_time", 1);
  pref("mail.identity.id1.useremail", mail.address);
  pref("mail.identity.id1.fullName", "Tinyhat Agent");
  pref("mail.identity.id1.smtpServer", "smtp1");
  var smtpServers = [];
  try { smtpServers = getPref("mail.smtpservers").split(",").filter(Boolean); } catch (_) {}
  if (!smtpServers.includes("smtp1")) smtpServers.unshift("smtp1");
  pref("mail.smtpservers", smtpServers.join(","));
  pref("mail.smtp.defaultserver", "smtp1");
  pref("mail.smtpserver.smtp1.hostname", mail.host);
  pref("mail.smtpserver.smtp1.port", 465);
  pref("mail.smtpserver.smtp1.try_ssl", 3);
  pref("mail.smtpserver.smtp1.authMethod", 3);
  pref("mail.smtpserver.smtp1.username", mail.username);
  defaultPref("mail.shell.checkDefaultClient", false);
  defaultPref("mailnews.start_page.enabled", false);
  defaultPref("mailnews.default_view_flags", 1);
  defaultPref("mail.pane_config.dynamic", 2);
  // Seed the public in-memory password properties before login_at_startup.
  // No NSS database edits and no password in prefs.js or JavaScript source.
  MailServices.accounts.getAccount("account1").incomingServer.password = mail.password;
  var outgoing = MailServices.outgoingServer || MailServices.smtp;
  outgoing.getServerByKey("smtp1").password = mail.password;
  mail.password = "";
  data = "";
}
